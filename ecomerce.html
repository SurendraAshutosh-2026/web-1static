<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxora Premium Store | Elite Shopping Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           1. PREMIUM DESIGN SYSTEM & VARIABLES
           ========================================== */
        :root {
            --primary-gradient: linear-gradient(135deg, #6c5ce7, #a8a5ff);
            --accent-gradient: linear-gradient(135deg, #ff4757, #ff6b81);
            --dark-color: #0f1115;
            --surface-color: #ffffff;
            --body-bg: #f4f6fa;
            --border-color: #e4e7eb;
            --text-main: #1e2229;
            --text-muted: #68768e;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 40px -15px rgba(0, 0, 0, 0.15);
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--body-bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
        }

        /* ==========================================
           2. ANIMATIONS LIBRARY
           ========================================== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(108, 92, 231, 0); }
            100% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0); }
        }

        /* ==========================================
           3. FLOATING GLASS NAVIGATION BAR
           ========================================== */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 85px;
        }

        .logo h2 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--dark-color);
        }

        .logo h2 span {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box {
            position: relative;
            width: 45%;
            transition: var(--transition-smooth);
        }

        .search-box input {
            width: 100%;
            padding: 14px 25px 14px 50px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            border-radius: 30px;
            outline: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .search-box input:focus {
            background: #fff;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
            width: 105%;
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: var(--transition-smooth);
        }

        .search-box input:focus + i {
            color: #6c5ce7;
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            width: 50px;
            height: 50px;
            background: #f8fafc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition-smooth);
            border: 1px solid var(--border-color);
        }

        .cart-icon:hover {
            background: var(--dark-color);
            color: #fff;
            transform: scale(1.1);
        }

        #cart-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent-gradient);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
        }

        /* ==========================================
           4. MAIN RESPONSIVE CORE LAYOUT
           ========================================== */
        main {
            display: flex;
            margin-top: 40px;
            gap: 40px;
            min-height: 85vh;
            animation: fadeIn 0.8s ease;
        }

        /* PREMIUM SIDEBAR */
        .filters-sidebar {
            width: 260px;
            flex-shrink: 0;
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 24px;
            height: fit-content;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(228, 231, 235, 0.6);
            position: sticky;
            top: 125px;
        }

        .filters-sidebar h3 {
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 14px 18px;
            cursor: pointer;
            margin-bottom: 8px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .category-item:hover {
            background: #f8fafc;
            color: var(--text-main);
            transform: translateX(5px);
        }

        .category-item.active {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 10px 20px -5px rgba(108, 92, 231, 0.3);
        }

        /* PRODUCT SECTIONS */
        .products-section {
            flex-grow: 1;
        }

        .section-header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-header-box h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* ==========================================
           5. DYNAMIC HD HOVER-ACTION CARD DESIGNS
           ========================================== */
        .product-card {
            background-color: var(--surface-color);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(228, 231, 235, 0.5);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-lg);
            border-color: rgba(108, 92, 231, 0.2);
        }

        .img-container {
            width: 100%;
            height: 280px;
            overflow: hidden;
            background: #f8fafc;
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-card:hover .product-img {
            transform: scale(1.1);
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 17, 21, 0.75);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        .product-info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            transition: var(--transition-smooth);
        }

        .product-card:hover .product-title {
            color: #6c5ce7;
        }

        .product-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .product-price-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #f1f3f7;
        }

        .price {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark-color);
        }

        .add-to-cart-btn {
            background-color: #f1f3f7;
            color: var(--dark-color);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .product-card:hover .add-to-cart-btn {
            background: var(--dark-color);
            color: #fff;
        }

        .add-to-cart-btn:hover {
            background: var(--primary-gradient) !important;
            color: #fff !important;
            transform: scale(1.15) rotate(90deg);
            animation: pulseGlow 1.5s infinite;
        }

        /* ==========================================
           6. ULTRA SLICK CART DRAWER SYSTEM
           ========================================== */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -460px;
            width: 440px;
            height: 100%;
            background-color: var(--surface-color);
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
        }

        .cart-header h3 {
            font-size: 20px;
            font-weight: 800;
        }

        .close-cart {
            cursor: pointer;
            font-size: 20px;
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
        }

        .close-cart:hover {
            transform: rotate(90deg);
            background: #ff4757;
            color: white;
        }

        .cart-items-container {
            padding: 30px;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid #edf0f4;
            transition: var(--transition-smooth);
        }

        .cart-item:hover {
            transform: translateX(-5px);
            box-shadow: var(--shadow-sm);
        }

        .cart-item-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-info h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .cart-item-info p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .remove-item {
            color: #ff4757;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .remove-item:hover {
            background: rgba(255, 71, 87, 0.1);
            transform: scale(1.1);
        }

        .cart-footer {
            padding: 30px;
            border-top: 1px solid var(--border-color);
            background: #f8fafc;
        }

        .total-price-box {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            background: var(--dark-color);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 10px 20px rgba(15, 17, 21, 0.15);
        }

        .checkout-btn:hover {
            background: var(--primary-gradient);
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
            transform: translateY(-2px);
        }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 17, 21, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1999;
            display: none;
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .cart-overlay.show {
            display: block;
            opacity: 1;
        }

        /* ==========================================
           7. MODERN INTERACTIVE FOOTER
           ========================================== */
        footer {
            background-color: var(--dark-color);
            color: #fff;
            text-align: center;
            padding: 40px 0;
            margin-top: 80px;
            border-top: 4px solid #6c5ce7;
        }

        footer p {
            font-size: 14px;
            color: #a4b0be;
            font-weight: 500;
        }

        /* MOBILE OPTIMIZATIONS */
        @media (max-width: 992px) {
            main { flex-direction: column; }
            .filters-sidebar { width: 100%; position: static; }
            .search-box { width: 60%; }
            .cart-drawer { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <header id="site-header">
        <div class="navbar container">
            <div class="logo">
                <h2>Luxora<span>Store</span></h2>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search curated luxury items...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="nav-icons">
                <div class="cart-icon" id="cart-icon-btn">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <aside class="filters-sidebar">
            <h3>Categories</h3>
            <ul class="category-list">
                <li class="category-item active" data-category="all">All Collection</li>
                <li class="category-item" data-category="electronics">Electronics</li>
                <li class="category-item" data-category="fashion">Fashion Wear</li>
                <li class="category-item" data-category="accessories">Accessories</li>
            </ul>
        </aside>

        <section class="products-section">
            <div class="section-header-box">
                <h2>Featured Products</h2>
            </div>
            <div class="products-grid" id="products-container">
            </div>
        </section>
    </main>

    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>Shopping Bag</h3>
            <div class="close-cart" id="close-cart-btn">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>
        <div class="cart-items-container" id="cart-items-container">
        </div>
        <div class="cart-footer">
            <div class="total-price-box">
                <span>Subtotal</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="alert('Thank you for shopping! Initiating Secure Checkout Engine.')">Proceed To Checkout</button>
        </div>
    </div>
    
    <div class="cart-overlay" id="cart-overlay"></div>

    <footer>
        <p>&copy; 2026 Luxora Store International. All Premium Architectural Components Reserved.</p>
    </footer>

    <script>
        // HD Curated Product Database Configuration Matrix 
        // Updated with ultra-high quality specific images from Unsplash
        const productsData = [
            { 
                id: 1, 
                title: "Acoustic Pro Headphones", 
                price: 299.99, 
                category: "electronics", 
                desc: "Studio grade wireless auditory fidelity featuring adaptive spatial environment cancellation.", 
                image: "https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=600&q=80", 
                tag: "Best Seller" 
            },
            { 
                id: 2, 
                title: "Chronograph Minimalist Watch", 
                price: 450.00, 
                category: "electronics", 
                desc: "Monolithic titanium structural assembly architecture equipped with sapphire tactical glass paneling.", 
                image: "https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=600&q=80", 
                tag: "Elite Luxury" 
            },
            { 
                id: 3, 
                title: "Suede Silhouette Overcoat", 
                price: 189.99, 
                category: "fashion", 
                desc: "Hand-stitched reinforced structural fiber lines optimized for cross-seasonal thermodynamic comfort.", 
                image: "https://images.unsplash.com/photo-1544022613-e87ca75a784a?auto=format&fit=crop&w=600&q=80", 
                tag: "New Season" 
            },
            { 
                id: 4, 
                title: "Vanguard Techknit Runners", 
                price: 135.50, 
                category: "fashion", 
                desc: "Aerated hyper-responsive polymer soles engineering optimized geometric acceleration kinetics.", 
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80", 
                tag: "Limited Run" 
            },
            { 
                id: 5, 
                title: "Urban Explorer Commuter Pack", 
                price: 95.00, 
                category: "accessories", 
                desc: "Hydrophobic ballistic grade woven composite matrix containing rapid access utility layout segments.", 
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80", 
                tag: "Premium Craft" 
            },
            { 
                id: 6, 
                title: "Aviator Titanium Shades", 
                price: 120.00, 
                category: "accessories", 
                desc: "Laser micro-milled continuous frame design implementing premium polarized chromatic visual defense layers.", 
                image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80", 
                tag: "Pure Craft" 
            }
        ];

        // Central Application Operational Lifecycle States
        let cart = [];

        // UI Document Model Reference Mapping Nodes
        const productsContainer = document.getElementById('products-container');
        const cartDrawer = document.getElementById('cart-drawer');
        const cartOverlay = document.getElementById('cart-overlay');
        const cartIconBtn = document.getElementById('cart-icon-btn');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const cartItemsContainer = document.getElementById('cart-items-container');
        const cartTotalPriceElement = document.getElementById('cart-total-price');
        const cartCountElement = document.getElementById('cart-count');
        const searchInput = document.getElementById('search-input');
        const categoryItems = document.querySelectorAll('.category-item');

        // Render Controller Pipeline: Hydrate Product Grid Elements
        function renderProducts(productsList) {
            productsContainer.innerHTML = "";
            if(productsList.length === 0) {
                productsContainer.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: var(--text-muted);">
                        <i class="fa-solid fa-box-open" style="font-size: 48px; margin-bottom: 15px; color: #ced6e0;"></i>
                        <p style="font-weight: 600;">No premium items correspond to your target query.</p>
                    </div>`;
                return;
            }
            
            productsList.forEach((product, index) => {
                const card = document.createElement('div');
                card.classList.add('product-card');
                card.style.animation = `fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${index * 0.05}s`;
                card.innerHTML = `
                    <div class="img-container">
                        <span class="badge">${product.tag}</span>
                        <img src="${product.image}" alt="${product.title}" class="product-img" loading="lazy">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${product.title}</h3>
                        <p class="product-desc">${product.desc}</p>
                        <div class="product-price-btn">
                            <span class="price">$${product.price.toFixed(2)}</span>
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})" aria-label="Add item to shopping bag">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
                productsContainer.appendChild(card);
            });
        }

        // Cart Actions Engine Processor: Register Add Sequence
        function addToCart(productId) {
            const matchedProduct = productsData.find(p => p.id === productId);
            const existingCartItem = cart.find(item => item.id === productId);

            if(existingCartItem) {
                existingCartItem.quantity += 1;
            } else {
                cart.push({ ...matchedProduct, quantity: 1 });
            }
            
            updateCartUI();
            openCart();
        }

        // Cart Actions Engine Processor: Register Delete Sequence
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        // Display Synchronizer Logic Block: Re-evaluate Aggregations
        function updateCartUI() {
            cartItemsContainer.innerHTML = "";
            let totalCount = 0;
            let totalPrice = 0;

            if(cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div style="text-align: center; margin: auto; color: var(--text-muted); padding-top: 50px;">
                        <i class="fa-solid fa-bag-shopping" style="font-size: 40px; margin-bottom: 15px; opacity: 0.3;"></i>
                        <p style="font-size: 14px; font-weight: 600;">Your shopping bag is completely empty.</p>
                    </div>`;
            }

            cart.forEach(item => {
                totalCount += item.quantity;
                totalPrice += (item.price * item.quantity);

                const cartItemHtml = document.createElement('div');
                cartItemHtml.classList.add('cart-item');
                cartItemHtml.innerHTML = `
                    <img src="${item.image}" alt="${item.title}" class="cart-item-img">
                    <div class="cart-item-info">
                        <h4>${item.title}</h4>
                        <p>$${item.price.toFixed(2)} &times; ${item.quantity}</p>
                    </div>
                    <div class="remove-item" onclick="removeFromCart(${item.id})" title="Remove item from bag">
                        <i class="fa-solid fa-trash-can"></i>
                    </div>
                `;
                cartItemsContainer.appendChild(cartItemHtml);
            });

            cartCountElement.innerText = totalCount;
            cartTotalPriceElement.innerText = `$${totalPrice.toFixed(2)}`;
        }

        // Animation Transitions Implementation Layer (Open/Close Drawer)
        function openCart() {
            cartDrawer.classList.add('open');
            cartOverlay.style.display = 'block';
            setTimeout(() => cartOverlay.classList.add('show'), 10);
        }

        function closeCart() {
            cartDrawer.classList.remove('open');
            cartOverlay.classList.remove('show');
            setTimeout(() => cartOverlay.style.display = 'none', 400);
        }

        // Structural Event Registrations Block
        cartIconBtn.addEventListener('click', openCart);
        closeCartBtn.addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', closeCart);

        // Substring Matching Search Query Filter Pipeline
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const filtered = productsData.filter(p => p.title.toLowerCase().includes(keyword) || p.desc.toLowerCase().includes(keyword));
            renderProducts(filtered);
        });

        // Category Matrix Filter Controller Node Click Management
        categoryItems.forEach(button => {
            button.addEventListener('click', (e) => {
                categoryItems.forEach(btn => btn.classList.remove('active'));
                
                // Ensure proper dataset reference targeted element selection context
                const targetedListItem = e.target.closest('.category-item');
                targetedListItem.classList.add('active');

                const targetedCategory = targetedListItem.getAttribute('data-category');
                if(targetedCategory === 'all') {
                    renderProducts(productsData);
                } else {
                    const filtered = productsData.filter(p => p.category === targetedCategory);
                    renderProducts(filtered);
                }
            });
        });

        // App Structural Deployment Instantiation Lifecycle Hook
        window.addEventListener('DOMContentLoaded', () => {
            renderProducts(productsData);
            updateCartUI();
        });
    </script>
</body>
</html>
